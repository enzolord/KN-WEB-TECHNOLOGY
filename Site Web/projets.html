<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nos réalisations | KN Web Technology – Agence digitale Cameroun</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Découvrez nos réalisations : sites web, e-commerce, applications et stratégies digitales pour les PME camerounaises. Exemples concrets de nos projets.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #05050A;
      color: #EAEAEF;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }
    :root {
      --primary: #6366F1;
      --accent: #FBBF24;
      --muted: #9CA3AF;
      --surface: rgba(15, 23, 42, 0.5);
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .section {
      padding: 4rem 0;
    }
    .s-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99,102,241,0.12);
      backdrop-filter: blur(2px);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #A5B4FC;
      border: 1px solid rgba(99,102,241,0.3);
      margin-bottom: 1rem;
    }
    .s-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    .s-title span {
      background: linear-gradient(135deg, #6366F1, #A855F7, #FBBF24);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* Hero avec fond animé */
    .projets-hero {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 10% 30%, rgba(99, 102, 241, 0.15), transparent 70%);
      padding: 6rem 0 2rem;
      text-align: center;
    }
    .hero-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .hero-particle {
      position: absolute;
      background: rgba(99, 102, 241, 0.3);
      border-radius: 50%;
      filter: blur(2px);
      animation: floatParticle 10s infinite alternate;
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.1; }
      100% { transform: translateY(-40px) translateX(30px); opacity: 0.6; }
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    /* Filtres */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin: 2rem 0 3rem;
    }
    .filter-btn {
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(99,102,241,0.3);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      color: #CBD5E1;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    /* Grille projets */
    .projets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }
    .projet-card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      border: 1px solid rgba(99,102,241,0.2);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .projet-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.4);
      border-color: var(--primary);
    }
    .projet-image {
      height: 220px;
      overflow: hidden;
    }
    .projet-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .projet-card:hover .projet-image img {
      transform: scale(1.05);
    }
    .projet-content {
      padding: 1.5rem;
    }
    .projet-category {
      display: inline-block;
      background: rgba(99,102,241,0.2);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.8rem;
    }
    .projet-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .projet-description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .projet-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      transition: gap 0.2s;
    }
    .projet-link:hover {
      gap: 0.8rem;
      color: var(--accent);
    }
    /* Aucun résultat */
    .no-results {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem;
      color: var(--muted);
    }
    @media (max-width: 780px) {
      .projets-grid {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 0 1.5rem;
      }
    }
  </style>
</head>
<body data-page="projets">
  <div id="site-header"></div>

  <!-- Hero avec fond animé -->
  <section class="projets-hero">
    <div class="hero-particles" id="heroParticles"></div>
    <div class="container hero-content" data-aos="fade-up">
      <div class="s-label"><i class="fas fa-trophy"></i> Portfolio</div>
      <h1 class="s-title">Nos <span>réalisations</span></h1>
      <p class="s-sub" style="max-width:700px; margin:0 auto; color:var(--muted);">Découvrez des projets concrets qui ont propulsé nos clients vers le succès digital.</p>
    </div>
  </section>

  <!-- Filtres -->
  <div class="container">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="web">Sites Web</button>
      <button class="filter-btn" data-filter="ecommerce">E‑commerce</button>
      <button class="filter-btn" data-filter="marketing">Marketing / SEO</button>
      <button class="filter-btn" data-filter="branding">Branding</button>
    </div>
  </div>

  <!-- Grille des projets -->
  <section class="section">
    <div class="container">
      <div class="projets-grid" id="projetsGrid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    // Génération des particules
    function generateParticles() {
      const container = document.getElementById('heroParticles');
      if (!container) return;
      const count = 45;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.classList.add('hero-particle');
        const size = Math.random() * 8 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 5 + 's';
        p.style.animationDuration = Math.random() * 8 + 4 + 's';
        container.appendChild(p);
      }
    }
    generateParticles();

    // Base de données des projets (à personnaliser)
    const projets = [
      {
        id: 1,
        title: "Restaurant Chez Maman",
        category: "web",
        description: "Site vitrine moderne avec réservation en ligne et SEO local. +200% de commandes en 3 mois.",
        image: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop",
        link: "https://exemple.com/chez-maman",
        linkText: "Voir le site"
      },
      {
        id: 2,
        title: "Mode City",
        category: "ecommerce",
        description: "Boutique e‑commerce avec paiement MTN Mobile Money. Catalogue de 500+ produits.",
        image: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&h=400&fit=crop",
        link: "https://exemple.com/mode-city",
        linkText: "Visiter la boutique"
      },
      {
        id: 3,
        title: "Quincaillerie Batimat",
        category: "marketing",
        description: "Stratégie SEO locale + fiche Google Business. +150 appels/mois et premier résultat pour 'quincaillerie Édéa'.",
        image: "https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?w=600&h=400&fit=crop",
        link: "https://exemple.com/batimat",
        linkText: "Découvrir"
      },
      {
        id: 4,
        title: "Clinique du Littoral",
        category: "web",
        description: "Site institutionnel avec prise de rendez-vous en ligne et chatbot WhatsApp.",
        image: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=600&h=400&fit=crop",
        link: "https://exemple.com/clinique",
        linkText: "Voir le projet"
      },
      {
        id: 5,
        title: "Résidence Les Palmiers",
        category: "ecommerce",
        description: "Plateforme de réservation d'hébergements avec paiement Orange Money et synchronisation calendrier.",
        image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&h=400&fit=crop",
        link: "https://exemple.com/palmiers",
        linkText: "Explorer"
      },
      {
        id: 6,
        title: "École Excellence",
        category: "branding",
        description: "Identité visuelle complète (logo, charte, supports) + site d’inscription en ligne. +35 nouvelles inscriptions.",
        image: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600&h=400&fit=crop",
        link: "https://exemple.com/ecole",
        linkText: "Découvrir l'identité"
      },
      {
        id: 7,
        title: "AgroPlus Cameroun",
        category: "web",
        description: "Site vitrine avec catalogue produits agricoles et formulaire de contact optimisé.",
        image: "https://images.unsplash.com/photo-1592982537447-7440770cbfc9?w=600&h=400&fit=crop",
        link: "https://exemple.com/agroplus",
        linkText: "Visiter"
      },
      {
        id: 8,
        title: "Beauté & Nature",
        category: "ecommerce",
        description: "Boutique de cosmétiques naturels avec paiement Mobile Money et panier d'achat intelligent.",
        image: "https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600&h=400&fit=crop",
        link: "https://exemple.com/beaute",
        linkText: "Voir la boutique"
      },
      {
        id: 9,
        title: "Construction Habitat",
        category: "marketing",
        description: "Campagne Google Ads + SEO local. Triplement des demandes de devis en 2 mois.",
        image: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=600&h=400&fit=crop",
        link: "https://exemple.com/habitat",
        linkText: "Lire l'étude de cas"
      }
    ];

    function getCategoryLabel(cat) {
      const labels = { web: "Site Web", ecommerce: "E‑commerce", marketing: "Marketing / SEO", branding: "Branding" };
      return labels[cat] || cat;
    }

    function renderProjets(filter = "all") {
      const grid = document.getElementById("projetsGrid");
      const filtered = filter === "all" ? projets : projets.filter(p => p.category === filter);
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">Aucun projet dans cette catégorie pour le moment.</div>`;
        return;
      }
      grid.innerHTML = filtered.map(projet => `
        <div class="projet-card" data-aos="fade-up" data-aos-delay="100">
          <div class="projet-image">
            <img src="${projet.image}" alt="${projet.title}">
          </div>
          <div class="projet-content">
            <span class="projet-category">${getCategoryLabel(projet.category)}</span>
            <h3 class="projet-title">${projet.title}</h3>
            <p class="projet-description">${projet.description}</p>
            <a href="${projet.link}" target="_blank" rel="noopener" class="projet-link">${projet.linkText} <i class="fas fa-arrow-right"></i></a>
          </div>
        </div>
      `).join("");
    }

    // Filtres
    const filterBtns = document.querySelectorAll(".filter-btn");
    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const filter = btn.getAttribute("data-filter");
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderProjets(filter);
      });
    });

    renderProjets("all");
  </script>
  <script src="js/layout.js"></script>
</body>
</html>
