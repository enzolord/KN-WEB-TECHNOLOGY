<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>KN WEB & TECHNOLOGY | Blog & Ressources Digitales</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="images/logo/favicon.png" type="image/x-icon">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0a0c14;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    /* Header du blog */
    .blog-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(99, 102, 241, 0.15);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    .sub {
      color: #94a3b8;
      max-width: 700px;
      margin: 0 auto;
      font-size: 1.1rem;
    }

    /* Filtres et recherche */
    .blog-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .filter-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      color: #cbd5e1;
    }

    .filter-btn.active, .filter-btn:hover {
      background: #6366f1;
      color: white;
      border-color: #6366f1;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.3rem 0.5rem;
      border-radius: 60px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .search-box input {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      color: white;
      outline: none;
      font-size: 0.9rem;
      width: 220px;
    }

    .search-box button {
      background: #6366f1;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .search-box button:hover {
      background: #a855f7;
    }

    /* Grille des articles */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* Carte article */
    .blog-card {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      border: 1px solid rgba(99, 102, 241, 0.2);
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .blog-card:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.4);
    }

    .card-img {
      position: relative;
      height: 220px;
      background-size: cover;
      background-position: center;
    }

    /* Étiquette date couleur or en haut à gauche */
    .date-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0a0c14;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 2;
    }

    .card-category {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #6366f1;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-body {
      padding: 1.5rem;
    }

    .card-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .card-excerpt {
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .read-more {
      color: #a5b4fc;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: gap 0.3s;
    }

    .blog-card:hover .read-more {
      gap: 0.8rem;
      color: #fff;
    }

    /* Modal pour l'article complet */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal-content {
      background: #0f172a;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 2rem;
      border: 1px solid rgba(99,102,241,0.5);
      padding: 2rem;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 1.8rem;
      cursor: pointer;
      color: #94a3b8;
      transition: 0.3s;
    }

    .close-modal:hover {
      color: white;
    }

    .modal-img {
      width: 100%;
      height: 280px;
      background-size: cover;
      background-position: center;
      border-radius: 1.2rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .modal h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .modal .meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .modal p {
      margin-bottom: 1rem;
      line-height: 1.7;
    }

    .modal h3 {
      margin: 1.5rem 0 0.8rem 0;
      color: #a5b4fc;
    }

    .modal ul, .modal ol {
      margin: 0.8rem 0 1rem 1.5rem;
    }

    .modal li {
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 2rem 1rem;
      }
      .blog-grid {
        grid-template-columns: 1fr;
      }
      .blog-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box input {
        width: auto;
      }
    }
  /* Styles spécifiques pour la hero blog – à ajouter dans votre fichier CSS */
.hero-blog {
  position: relative;
  min-height: 85vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  padding: 0 4%;
  background: linear-gradient(135deg, #0a0c14 0%, #0f172a 100%);
}

.hero-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.12), transparent 70%);
  pointer-events: none;
}

.hero-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hero-inner {
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3rem;
  flex-wrap: wrap;
  z-index: 2;
  position: relative;
}

/* Colonne texte */
.hero-content {
  flex: 1.2;
  min-width: 300px;
  animation: fadeInUp 0.8s ease-out;
}

.hero-label {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: rgba(99, 102, 241, 0.15);
  backdrop-filter: blur(8px);
  padding: 0.5rem 1.2rem;
  border-radius: 40px;
  font-size: 0.8rem;
  font-weight: 500;
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.4);
  margin-bottom: 1.5rem;
}

.hero-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 1.2rem;
  color: #fff;
  letter-spacing: -0.02em;
}

.gradient-text {
  background: linear-gradient(135deg, #fbbf24, #f59e0b, #eab308);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: textShine 6s linear infinite;
}

@keyframes textShine {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.hero-sub {
  font-size: 1rem;
  line-height: 1.6;
  color: #cbd5e1;
  max-width: 550px;
  margin-bottom: 2rem;
}

/* Boutons animés */
.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 1.2rem;
  margin-bottom: 2rem;
}

.btn-primary, .btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.9rem 2rem;
  border-radius: 60px;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.btn-primary {
  background: linear-gradient(95deg, #6366f1, #a855f7);
  color: white;
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
  animation: float 3s ease-in-out infinite;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(95deg, #a855f7, #6366f1);
  transition: left 0.4s ease;
  z-index: -1;
}

.btn-primary:hover::before {
  left: 0;
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
}

.btn-secondary {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(245, 158, 11, 0.6);
  color: #fde68a;
  animation: borderPulse 2s infinite;
}

.btn-secondary:hover {
  background: rgba(245, 158, 11, 0.2);
  transform: translateY(-3px);
  border-color: #fbbf24;
  box-shadow: 0 0 15px rgba(245,158,11,0.4);
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0px); }
}

@keyframes borderPulse {
  0% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 0px rgba(245,158,11,0); }
  50% { border-color: #fbbf24; box-shadow: 0 0 12px rgba(245,158,11,0.4); }
  100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 0px rgba(245,158,11,0); }
}

/* Statistiques */
.hero-stats {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  margin-top: 1rem;
}

.stat {
  font-size: 0.85rem;
  color: #94a3b8;
}

.stat span {
  font-size: 1.4rem;
  font-weight: 800;
  color: #fbbf24;
  display: block;
  margin-bottom: 0.2rem;
}

/* Image stylisée */
.hero-image {
  flex: 1;
  min-width: 300px;
  display: flex;
  justify-content: center;
  perspective: 1000px;
}

.hero-image-inner {
  position: relative;
  width: 100%;
  max-width: 450px;
  border-radius: 2rem;
  overflow: hidden;
  transform: rotateY(3deg) rotateX(2deg);
  transition: transform 0.5s ease;
  box-shadow: 0 25px 40px -20px rgba(0,0,0,0.6);
}

.hero-image-inner:hover {
  transform: rotateY(0deg) rotateX(0deg) scale(1.02);
}

.hero-image-inner img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 2rem;
}

.hero-image-glow {
  position: absolute;
  inset: 0;
  border-radius: 2rem;
  background: radial-gradient(circle at 30% 40%, rgba(245,158,11,0.3), transparent 70%);
  pointer-events: none;
  mix-blend-mode: overlay;
}

/* Scroll indicator */
.hero-scroll-indicator {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
  color: #94a3b8;
  animation: fadeInUp 1s ease-out 0.5s both;
}

.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, #fbbf24, transparent);
  animation: scrollAnim 2s infinite;
}

@keyframes scrollAnim {
  0% { transform: scaleY(0.3); opacity: 0.5; }
  50% { transform: scaleY(1); opacity: 1; }
  100% { transform: scaleY(0.3); opacity: 0.5; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 900px) {
  .hero-inner {
    flex-direction: column;
    text-align: center;
    padding: 5rem 0 3rem;
  }
  .hero-content {
    text-align: center;
    align-items: center;
  }
  .hero-sub {
    max-width: 100%;
  }
  .hero-buttons {
    justify-content: center;
  }
  .hero-stats {
    justify-content: center;
  }
  .hero-image {
    margin-top: 2rem;
  }
}
  </style>
</head>

<script>
  // Base de données des articles – chacun avec un contenu très long et enrichi
  const articles = [
    {
      id: 1,
      title: "Comment être premier sur Google à Douala ou Édéa – Guide SEO local complet 2025",
      excerpt: "Découvrez les techniques avancées de référencement local au Cameroun : mots-clés géolocalisés, Google Business Profile, citations locales et netlinking.",
      content: `
        <h3>Pourquoi le SEO local est-il indispensable pour votre PME camerounaise ?</h3>
        <p>Plus de 80 % des consommateurs utilisent Google pour trouver un service près de chez eux. Que vous soyez à Douala, Yaoundé, Édéa ou Bafoussam, apparaître dans les premiers résultats de recherche locale peut doubler votre chiffre d'affaires. Contrairement aux idées reçues, le référencement local ne nécessite pas un gros budget, mais une stratégie cohérente et une connaissance des spécificités camerounaises.</p>
        <h3>1. Optimisez votre fiche Google Business Profile (ex Google My Business)</h3>
        <p>La fiche Google est le pilier du SEO local. Voici les actions prioritaires :</p>
        <ul>
          <li><strong>Complétez toutes les informations</strong> : nom, adresse, téléphone, site web, horaires d'ouverture précis.</li>
          <li><strong>Ajoutez des photos régulièrement</strong> (locaux, produits, équipe). Les entreprises avec des images reçoivent 42 % de demandes d'itinéraire en plus.</li>
          <li><strong>Encouragez les avis clients</strong> : répondez à chaque avis (positif ou négatif) avec professionnalisme. Utilisez les mots-clés dans vos réponses.</li>
          <li><strong>Publiez des posts Google</strong> : annonces, offres spéciales, événements. Cela montre à Google que votre fiche est active.</li>
        </ul>
        <h3>2. Structurez votre site pour les recherches locales</h3>
        <p>Votre site doit parler aux robots et aux humains. Adoptez ces bonnes pratiques :</p>
        <ul>
          <li><strong>Créez une page "Nous contacter"</strong> avec votre adresse complète, carte interactive et un schéma LocalBusiness (données structurées).</li>
          <li><strong>Intégrez des pages "ville"</strong> : si vous couvrez plusieurs zones, dédiez une page par localité (ex : "plombier Douala", "plombier Édéa").</li>
          <li><strong>Utilisez des balises title et meta description</strong> incluant le nom de la ville et le service principal.</li>
          <li><strong>Ajoutez un plan du site (sitemap)</strong> et assurez-vous que votre site est rapide et mobile-friendly.</li>
        </ul>
        <h3>3. Obtenez des citations et backlinks locaux</h3>
        <p>Les annuaires locaux et les liens depuis des sites camerounais renforcent votre autorité. Inscrivez-vous gratuitement sur :</p>
        <ul>
          <li>Annuaire camerounais (camerounweb, camerounlink, etc.)</li>
          <li>Chambres de commerce et sites d’associations professionnelles</li>
          <li>Blogs partenaires ou sites d'actualité locale (avec un article invité)</li>
        </ul>
        <h3>4. Mesurez vos résultats</h3>
        <p>Utilisez Google Search Console et Google Analytics pour suivre vos positions, le trafic organique et les conversions. Avec une stratégie bien appliquée, vous pouvez atteindre le top 3 en 2 à 4 mois.</p>
        <p><strong>Prêt à passer à l'action ?</strong> Nos experts SEO vous accompagnent avec un audit complet et un plan d'action mensuel sur mesure.</p>

      image: "https://images.unsplash.com/photo-1562577309-4932fdd64cd1?w=700&h=450&fit=crop"

    {
      id: 2,
      title: "5 automatisations WhatsApp Business qui transforment vos ventes",
      excerpt: "Utilisez WhatsApp Business pour générer des leads 24h/24, envoyer des rappels de paiement et fidéliser vos clients grâce à des scénarios automatisés.",
      content: `
        <p>WhatsApp est devenu le canal de communication commercial numéro 1 en Afrique centrale. Plus de 90 % des Camerounais équipés d’un smartphone l’utilisent quotidiennement. Automatiser certains échanges vous fait gagner un temps précieux tout en améliorant l’expérience client. Voici cinq automatisations puissantes que nous mettons en place pour nos clients.</p>
        <h3>1. Message d’accueil personnalisé avec qualification</h3>
        <p>Dès qu’un client vous écrit, répondez instantanément avec un message chaleureux qui présente votre activité et propose un catalogue. Ajoutez un court formulaire (via boutons) pour collecter nom, téléphone et besoin. Cela permet de qualifier le lead avant même une intervention humaine.</p>
        <h3>2. Catalogue produit interactif</h3>
        <p>WhatsApp Business permet de créer un catalogue avec images, prix et descriptions. En l’associant à un message automatique, vous offrez une vitrine 24h/24. Chaque produit peut être partagé en un clic, et le client commande directement par message.</p>
        <h3>3. Réponses rapides aux questions fréquentes</h3>
